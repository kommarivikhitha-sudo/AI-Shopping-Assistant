<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Shopping Assistant</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        #chat-box { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>AI Shopping Assistant</h1>
    <div id="chat-box"></div>
    <input type="text" id="user-input" placeholder="Ask about a product...">
    <button onclick="sendMessage()">Send</button>

    <script>
        function sendMessage() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            if (input.value.trim() !== "") {
                chatBox.innerHTML += `<p><b>You:</b> ${input.value}</p>`;
                // Simulated AI Response
                chatBox.innerHTML += `<p><b>Assistant:</b> I'm a simple assistant. You asked about: ${input.value}. (In a real app, I would connect to an AI API here!)</p>`;
                input.value = "";
            }
        }
    </script>
</body>
</html>
