<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Shopping Assistant</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        #chat-box { width: 100%; max-width: 500px; height: 400px; border: 1px solid #ccc; overflow-y: scroll; margin-bottom: 10px; padding: 10px; }
        .message { margin-bottom: 10px; padding: 8px; border-radius: 5px; }
        .user { background: #007bff; color: white; text-align: right; }
        .assistant { background: #e9ecef; }
        input { display: block; width: 100%; max-width: 500px; margin-bottom: 5px; padding: 8px; }
    </style>
</head>
<body>
    <h2>AI Shopping Assistant</h2>
    <div id="chat-box"></div>
    
    <!-- Paste your API Key here each time you visit -->
    <input type="password" id="api-key" placeholder="Paste your Google API Key here">
    <input type="text" id="user-input" placeholder="Ask about a product...">
    <button onclick="sendMessage()">Send</button>

    <script>
        async function sendMessage() {
            const key = document.getElementById('api-key').value;
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');

            if (input.value.trim() !== "" && key !== "") {
                chatBox.innerHTML += `<div class="message user"><b>You:</b> ${input.value}</div>`;
                const userText = input.value;
                input.value = "";

                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;

                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ "contents": [{ "parts": [{ "text": userText }] }] })
                    });
                    const data = await response.json();
                    const aiResponse = data.candidates[0].content.parts[0].text;
                    chatBox.innerHTML += `<div class="message assistant"><b>Assistant:</b> ${aiResponse}</div>`;
                } catch (error) {
                    chatBox.innerHTML += `<div class="message assistant"><b>Error:</b> Check your API Key.</div>`;
                }
                chatBox.scrollTop = chatBox.scrollHeight;
            } else {
                alert("Please enter both an API key and a question.");
            }
        }
    </script>
</body>
</html>
